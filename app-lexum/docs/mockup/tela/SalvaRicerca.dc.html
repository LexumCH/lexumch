<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Salva la chat in Ricerche</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lexum.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Outfit:wght@300;400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app {{tema}}">
<dc-import name="Risposta" tema="{{tema}}" hint-size="390px,844px"></dc-import>
<a href="Risposta.dc.html" class="velo" aria-label="Chiudi"></a>
<div class="foglio">
<span class="maniglia"></span>
<div style="display: flex; flex-direction: column; gap: 6px;">
<h2 class="d-s">Salva in Ricerche</h2>
<p class="t-small fg2">Scegli un'etichetta: la chat resta salvata e la ritrovi anche sul sito, con lo stesso account.</p>
</div>
<div class="cerca" style="height: 46px;">
<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<label for="q-etichetta" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Cerca o crea un'etichetta</label>
<input id="q-etichetta" type="search" placeholder="Cerca o crea etichetta…">
</div>
<div class="lista" style="margin: 0 -20px;" role="radiogroup" aria-label="Etichetta">
<button class="riga stretta" role="radio" aria-checked="true" style="background: var(--accent-soft);"><i class="pallino" style="background: #7FA39A;"></i><span class="corpo"><span class="ttl">Casa</span><span class="sub">3 elementi</span></span><svg viewBox="0 0 24 24" width="20" height="20" class="oro"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
<button class="riga stretta" role="radio" aria-checked="false"><i class="pallino" style="background: #C9A45C;"></i><span class="corpo"><span class="ttl">Fisco</span><span class="sub">6 elementi</span></span></button>
<button class="riga stretta" role="radio" aria-checked="false"><i class="pallino" style="background: #8DA3C4;"></i><span class="corpo"><span class="ttl">Lavoro</span><span class="sub">2 elementi</span></span></button>
<button class="riga stretta"><svg viewBox="0 0 24 24" width="18" height="18" class="oro"><path d="M12 5v14M5 12h14"/></svg><span class="corpo"><span class="ttl oro">Nuova etichetta</span></span></button>
</div>
<a href="Ricerche.dc.html" class="btn btn-oro">Salva in «Casa»</a>
<p class="t-cap">Una chat che non salvi non resta in memoria: funziona così anche sul sito.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { tema: this.props.tema ?? 'notte' };
}
}
</script>
</body>
</html>
